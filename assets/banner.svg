<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1280 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#111c38"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="subTextGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.12)}}@keyframes floatParticle1{0%{transform:translateY(0) translateX(0);opacity:.3}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes floatParticle2{0%{transform:translateY(0) translateX(0);opacity:.4}50%{transform:translateY(20px) translateX(-20px);opacity:.9}}@keyframes beamFlow{0%{stroke-dashoffset:1000}}.bg{fill:url(#bgGradient)}.grid-line{stroke:#1e293b;stroke-width:1;stroke-opacity:.35}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;letter-spacing:-.5px;fill:url(#textGrad)}.subtitle-text{font-weight:500;font-size:19px;fill:url(#subTextGrad)}.pill-bg{fill:#1e293b;fill-opacity:.7;stroke:#38bdf8;stroke-width:1.2;stroke-opacity:.5;rx:16}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif;font-weight:600;font-size:13px;fill:#38bdf8}.glow-orb1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 80px}.glow-orb2{animation:pulseGlow 8s ease-in-out infinite;transform-origin:1080px 280px}.particle1{animation:floatParticle1 7s ease-in-out infinite}.particle2{animation:floatParticle2 9s ease-in-out infinite}.dynamic-beam{stroke-dasharray:60 140;animation:beamFlow 14s linear infinite}</style><rect width="1280" height="360" class="bg"/><circle cx="200" cy="80" r="140" fill="#0284c7" class="glow-orb1" filter="url(#glow)" opacity=".2"/><circle cx="1080" cy="280" r="160" fill="#7c3aed" class="glow-orb2" filter="url(#glow)" opacity=".22"/><circle cx="640" cy="180" r="220" fill="#38bdf8" filter="url(#glow)" opacity=".07"/><g opacity=".4"><line x1="80" x2="80" y1="0" y2="360" class="grid-line"/><line x1="240" x2="240" y1="0" y2="360" class="grid-line"/><line x1="400" x2="400" y1="0" y2="360" class="grid-line"/><line x1="560" x2="560" y1="0" y2="360" class="grid-line"/><line x1="720" x2="720" y1="0" y2="360" class="grid-line"/><line x1="880" x2="880" y1="0" y2="360" class="grid-line"/><line x1="1040" x2="1040" y1="0" y2="360" class="grid-line"/><line x1="1200" x2="1200" y1="0" y2="360" class="grid-line"/><line x1="0" x2="1280" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1280" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1280" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1280" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1280" y1="300" y2="300" class="grid-line"/></g><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M-40 280 Q 280 320 640 270 T 1320 290" class="dynamic-beam" opacity=".35"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M-40 70 Q 340 40 640 90 T 1320 60" class="dynamic-beam" opacity=".3"/><circle cx="140" cy="220" r="3.5" fill="#38bdf8" class="particle1"/><circle cx="290" cy="90" r="2.5" fill="#818cf8" class="particle2"/><circle cx="980" cy="100" r="3" fill="#c084fc" class="particle1"/><circle cx="1140" cy="210" r="3.5" fill="#38bdf8" class="particle2"/><circle cx="640" cy="45" r="2" fill="#38bdf8" class="particle1"/><g id="foreground-content"><g transform="translate(640, 68)"><rect width="150" height="36" x="-75" y="-18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" rx="18"/><circle cx="-52" cy="0" r="5" fill="#10b981"/><text x="8" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED LIST</text></g><text x="640" y="150" class="title-text" text-anchor="middle">Awesome Cloud Machine Learning Platform</text><text x="640" y="195" class="subtitle-text" text-anchor="middle">Enterprise SaaS Ecosystems • High-Performance Open-Source MLOps • Foundation Model Serving</text><g><g transform="translate(640, 260) translate(-390, 0)"><rect width="130" height="34" x="0" y="0" class="pill-bg"/><text x="65" y="21" class="pill-text" text-anchor="middle">• MLOps Infra</text></g><g transform="translate(640, 260) translate(-240, 0)"><rect width="145" height="34" x="0" y="0" stroke="#818cf8" class="pill-bg"/><text x="72" y="21" fill="#818cf8" class="pill-text" text-anchor="middle">• LLM Serving</text></g><g transform="translate(640, 260) translate(-75, 0)"><rect width="150" height="34" x="0" y="0" stroke="#c084fc" class="pill-bg"/><text x="75" y="21" fill="#c084fc" class="pill-text" text-anchor="middle">• Model Registry</text></g><g transform="translate(640, 260) translate(95, 0)"><rect width="140" height="34" x="0" y="0" stroke="#34d399" class="pill-bg"/><text x="70" y="21" fill="#34d399" class="pill-text" text-anchor="middle">• Auto ML</text></g><g transform="translate(640, 260) translate(255, 0)"><rect width="150" height="34" x="0" y="0" stroke="#f472b6" class="pill-bg"/><text x="75" y="21" fill="#f472b6" class="pill-text" text-anchor="middle">• Feature Store</text></g></g></g></svg>