<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradient); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: url(#textGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: url(#subTextGrad);
    }
    .pill-bg {
      fill: #1e293b;
      fill-opacity: 0.7;
      stroke: #38bdf8;
      stroke-width: 1.2;
      stroke-opacity: 0.5;
      rx: 16;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.12); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(20px) translateX(-20px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .glow-orb1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 80px;
    }
    .glow-orb2 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 1080px 280px;
    }
    .particle1 { animation: floatParticle1 7s ease-in-out infinite; }
    .particle2 { animation: floatParticle2 9s ease-in-out infinite; }
    .dynamic-beam {
      stroke-dasharray: 60 140;
      animation: beamFlow 14s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="360" class="bg" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.2" class="glow-orb1" filter="url(#glow)" />
  <circle cx="1080" cy="280" r="160" fill="#7c3aed" opacity="0.22" class="glow-orb2" filter="url(#glow)" />
  <circle cx="640" cy="180" r="220" fill="#38bdf8" opacity="0.07" filter="url(#glow)" />

  <!-- Decorative Tech Grid (Behind text) -->
  <g opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="360" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="360" class="grid-line" />
    <line x1="1200" y1="0" x2="1200" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1280" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1280" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1280" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1280" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1280" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Cybernetic Data Paths -->
  <path d="M-40 280 Q 280 320 640 270 T 1320 290" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.35" class="dynamic-beam" />
  <path d="M-40 70 Q 340 40 640 90 T 1320 60" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3" class="dynamic-beam" />

  <!-- Floating Ambient Tech Nodes -->
  <circle cx="140" cy="220" r="3.5" fill="#38bdf8" class="particle1" />
  <circle cx="290" cy="90" r="2.5" fill="#818cf8" class="particle2" />
  <circle cx="980" cy="100" r="3" fill="#c084fc" class="particle1" />
  <circle cx="1140" cy="210" r="3.5" fill="#38bdf8" class="particle2" />
  <circle cx="640" cy="45" r="2" fill="#38bdf8" class="particle1" />

  <!-- Center Foreground Content - Header Text & Pills -->
  <g id="foreground-content">
    <!-- Icon/Badge Emblem -->
    <g transform="translate(640, 68)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="-52" cy="0" r="5" fill="#10b981" />
      <text x="8" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">CURATED LIST</text>
    </g>

    <!-- Main Title -->
    <text x="640" y="150" text-anchor="middle" class="title-text">Awesome Cloud Machine Learning Platform</text>

    <!-- Subtitle -->
    <text x="640" y="195" text-anchor="middle" class="subtitle-text">Enterprise SaaS Ecosystems &#8226; High-Performance Open-Source MLOps &#8226; Foundation Model Serving</text>

    <!-- Feature Tag Pills -->
    <g transform="translate(640, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-390, 0)">
        <rect x="0" y="0" width="130" height="34" class="pill-bg" />
        <text x="65" y="21" text-anchor="middle" class="pill-text">&#8226; MLOps Infra</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-240, 0)">
        <rect x="0" y="0" width="145" height="34" class="pill-bg" stroke="#818cf8" />
        <text x="72" y="21" text-anchor="middle" class="pill-text" fill="#818cf8">&#8226; LLM Serving</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(-75, 0)">
        <rect x="0" y="0" width="150" height="34" class="pill-bg" stroke="#c084fc" />
        <text x="75" y="21" text-anchor="middle" class="pill-text" fill="#c084fc">&#8226; Model Registry</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="140" height="34" class="pill-bg" stroke="#34d399" />
        <text x="70" y="21" text-anchor="middle" class="pill-text" fill="#34d399">&#8226; Auto ML</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(255, 0)">
        <rect x="0" y="0" width="150" height="34" class="pill-bg" stroke="#f472b6" />
        <text x="75" y="21" text-anchor="middle" class="pill-text" fill="#f472b6">&#8226; Feature Store</text>
      </g>
    </g>
  </g>
</svg>
